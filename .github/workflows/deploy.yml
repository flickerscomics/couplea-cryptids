# Builds the site and publishes it to GitHub Pages on every push to main.
#
# If the build fails (for example a typo in stock.edn), NOTHING is published.
# The live site keeps its last good version. Look at the Actions tab to see
# the plain-English message about what to fix.

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:   # also lets you press "Run workflow" by hand

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Newer pushes wait for the one already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Checks stock.edn + site.edn, compiles the optimised site, assembles dist/.
      - run: npm run build
        env:
          # The custom-order form posts to this Discord webhook.
          # It comes from the repo secret DISCORD_WEBHOOK_URL (never committed).
          # HEADS UP: a website has no server to hide it on, so the URL still
          # ends up inside the published JavaScript. Someone determined could
          # find it. Use a channel you don't mind getting spam in, and if it
          # ever leaks, delete that webhook in Discord and make a new one.
          # If the secret isn't set, the form runs in test mode (sends nothing).
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - uses: actions/configure-pages@v6

      # Only dist/ is published. The big original art stays out of it.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
