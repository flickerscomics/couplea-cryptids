<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#0e0e0d">
  <link rel="canonical" href="{{site-url}}">

  <!-- Link previews (Discord doesn't run JavaScript, so these live right here).
       The words in double curly brackets are filled in from site.edn at build time. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{business-name}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{site-url}}">
  <meta property="og:image" content="{{site-url}}art/og-card.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{business-name}} business card: a stag head and the number {{phone}}">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand+SC&family=Permanent+Marker&family=Source+Sans+3:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <noscript>
    <div class="noscript">
      <p><strong>{{business-name}}</strong></p>
      <p>This page needs JavaScript to show the shelves. Sorry about that.</p>
      <p>You can still reach us in-game. Call <strong>{{phone}}</strong>.</p>
    </div>
  </noscript>

  <div id="app"></div>

  <script src="js/main.js" defer></script>
</body>
</html>
